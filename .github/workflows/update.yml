name: Update Azeroth Survivors archive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-azeroth-survivors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update and validate package
        run: ./scripts/update.sh

      - name: Commit update
        id: commit
        run: |
          if git diff --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/azeroth-survivors.nix packages/archive-etag
          git commit -m "chore: update official Azeroth Survivors archive"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          if [ "${{ steps.commit.outputs.updated }}" = "true" ]; then
            echo "Updated Azeroth Survivors archive." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Azeroth Survivors archive are already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
